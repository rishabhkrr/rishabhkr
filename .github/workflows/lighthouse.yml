# Lighthouse CI: audits the static export on every PR and push to master.
# Fails on accessibility / best-practices / SEO regressions; performance is a warning
# (CI machines are noisy). Reports are uploaded as a workflow artifact.
name: Lighthouse CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build static export (no base path)
        run: npx next build
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
